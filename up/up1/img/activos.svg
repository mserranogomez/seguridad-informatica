<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="Arial, sans-serif">
  <text x="200" y="25" text-anchor="middle" fill="#2c3e50" font-size="15" font-weight="bold">4 Activos del Sistema de Información</text>
  <rect x="20" y="50" width="85" height="70" rx="8" fill="#e74c3c"/>
  <text x="62" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Información</text>
  <text x="62" y="95" text-anchor="middle" fill="white" font-size="9">Datos, archivos,</text>
  <text x="62" y="108" text-anchor="middle" fill="white" font-size="9">bases de datos</text>
  <rect x="115" y="50" width="85" height="70" rx="8" fill="#3498db"/>
  <text x="157" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Material</text>
  <text x="157" y="95" text-anchor="middle" fill="white" font-size="9">Hardware, redes,</text>
  <text x="157" y="108" text-anchor="middle" fill="white" font-size="9">instalaciones</text>
  <rect x="210" y="50" width="85" height="70" rx="8" fill="#2ecc71"/>
  <text x="252" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Redes</text>
  <text x="252" y="95" text-anchor="middle" fill="white" font-size="9">Comunicaciones,</text>
  <text x="252" y="108" text-anchor="middle" fill="white" font-size="9">conectividad</text>
  <rect x="305" y="50" width="85" height="70" rx="8" fill="#9b59b6"/>
  <text x="347" y="78" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Usuarios</text>
  <text x="347" y="95" text-anchor="middle" fill="white" font-size="9">Personas que</text>
  <text x="347" y="108" text-anchor="middle" fill="white" font-size="9">usan el SI</text>
  <text x="200" y="155" text-anchor="middle" fill="#7f8c8d" font-size="10">La seguridad debe proteger estos 4 elementos de amenazas y vulnerabilidades</text>
